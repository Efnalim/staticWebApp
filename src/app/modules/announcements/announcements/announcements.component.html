<mat-card class="example-card">
  <mat-card-header style="justify-content: space-between;">
    <app-list-header
      [title]="title"
      [menuItems]="menuItems"
      >
    </app-list-header>
  </mat-card-header>
  <mat-divider style="margin-top: 0.5rem;"></mat-divider>
  <mat-card-content style="padding-top: 16px; flex-grow: 1; display: flex; flex-direction: column;">
    <mat-label><strong>Akce</strong></mat-label>
    <mat-list role="list" style="max-height: 30vh; overflow-y: scroll">
      @for (event of events; track event) {
        <mat-list-item
          role="listitem"
          style="height: unset; padding: unset; display: flex"
          >
          <div
          style="
            width: 50%;
            overflow: hidden;
            margin-right: 2%;
            white-space: break-spaces;
          "
            >
            {{ event.summary }}
          </div>
          <div style="width: 30%">
            {{ event.start | dateFormat : "D.M.  H:mm"}}
          </div>
        </mat-list-item>
      }
    </mat-list>
    <mat-label style="margin-top: 2rem;"><strong>Narozeniny</strong></mat-label>
    <mat-list role="list" style="max-height: 30vh; overflow-y: scroll">
      @for (event of birthdays; track event) {
        <mat-list-item
          role="listitem"
          style="height: unset; padding: unset; display: flex"
          >
          <div
          style="
            width: 50%;
            overflow: hidden;
            margin-right: 2%;
            text-overflow: ellipsis;
          "
            >
            {{ event.summary }}
          </div>
          <div style="width: 30%">
            {{ event.start | dateFormat : "D.M."}}
          </div>
        </mat-list-item>
      }
    </mat-list>
    @if (fetchingData) {
      <mat-spinner style="margin: 0 auto;"></mat-spinner>
    }
    @if (errorMessage) {
      <span style="margin: 0 auto; color: red;">{{errorMessage}}</span>
    }
  </mat-card-content>
</mat-card>
